[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100
via_ir = true
extra_output = ["storageLayout"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

fs_permissions = [
  { access = "read-write", path = "../deployments" },
  # test/Vectors.t.sol writes the outcome vectors the web client checks its preview against
  { access = "read-write", path = "../web/src/game/fixtures" },
  # the upgrade tests start from the released bytecode
  { access = "read", path = "releases" },
  # script/Upgrade.s.sol compares the implementation with the build artifact
  { access = "read", path = "out" },
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64

[rpc_endpoints]
local = "http://127.0.0.1:8545"
fluent_testnet = "https://rpc.testnet.fluent.xyz"
fluent = "https://rpc.fluent.xyz"
