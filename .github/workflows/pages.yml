name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: web
        run: pnpm test
      # ABIs and addresses are committed under web/src/generated, so no Foundry build is needed here.
      - name: Build
        working-directory: web
        env:
          # Kept as secrets so they are masked in these public logs. They are still client ids: the built
          # site contains them, as any browser app must.
          VITE_FLUENT_APP_ID: ${{ secrets.VITE_FLUENT_APP_ID }}
          VITE_FLUENT_PRIVY_CLIENT_ID: ${{ secrets.VITE_FLUENT_PRIVY_CLIENT_ID }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
